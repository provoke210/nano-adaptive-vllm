[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-adaptive-vllm"
version = "0.1.0"
authors = [{ name = "Xingkai Yu" }, { name = "Haozhe Jiang" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "Latency-feedback mixed scheduling experiments based on nano-vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "xxhash>=3.5,<4",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0,<5",
    "flash-attn",
    "tqdm",
]
test = ["pytest>=8,<10"]
model-test = ["torch==2.8.0", "transformers==4.55.2", "safetensors>=0.4.3,<1", "pytest>=8,<10"]

[project.urls]
Homepage="https://github.com/provoke210/nano-adaptive-vllm"
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: opt-in CUDA and real-model correctness gate"]
